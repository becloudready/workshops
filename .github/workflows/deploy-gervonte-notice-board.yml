name: Deploy Gervonte Notice Board

on:
  push:
    branches: [master]
    paths:
      - "workshops/fullstack-aws/projects/02-notice-board/GervonteFowler/**"
      - ".github/workflows/deploy-gervonte-notice-board.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gervonte-notice-board-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'Gervonte/workshops'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: workshops/fullstack-aws/projects/02-notice-board/GervonteFowler

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workshops/fullstack-aws/projects/02-notice-board/GervonteFowler/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build Lambda artifact
        run: npm run lambda:build

      - name: Deploy Lambda
        run: >-
          aws lambda update-function-code
          --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}"
          --zip-file fileb://dist/lambda.zip

      - name: Build frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run client:build

      - name: Upload frontend
        run: aws s3 sync client/dist/ "s3://${{ secrets.S3_BUCKET }}/" --delete

      - name: Invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
