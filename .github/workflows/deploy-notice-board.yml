name: Deploy Notice Board

on:
  push:
    branches:
      - main
    paths:
      - 'workshops/fullstack-aws/projects/Group2_Addison_Alex_Marcos_Allen/02-notice-board copy/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: workshops/fullstack-aws/projects/Group2_Addison_Alex_Marcos_Allen/02-notice-board copy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Lambda zip
        run: python build.py

      - name: Deploy Lambda code
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://backend/lambda.zip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: workshops/fullstack-aws/projects/Group2_Addison_Alex_Marcos_Allen/02-notice-board copy/frontend
        run: npm install

      - name: Build frontend
        working-directory: workshops/fullstack-aws/projects/Group2_Addison_Alex_Marcos_Allen/02-notice-board copy/frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload frontend to S3
        run: |
          aws s3 sync "frontend/dist/" "s3://${{ secrets.S3_BUCKET }}/" --delete
      
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"