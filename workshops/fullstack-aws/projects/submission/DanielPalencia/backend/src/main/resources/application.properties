spring.application.name=geekychads

# Port. Not specified in Planning.md. Moved off Spring's default 8080, which is occupied on
# this machine by another project's container. The clash was worth the note it cost: the
# obvious symptom is "Port 8080 was already in use" at startup, but the expensive one came
# first - a GET returning 404 that was served by the OTHER application entirely, which is
# indistinguishable from a routing bug in code you just wrote. Before blaming a route,
# confirm which application answered.
#
# Being explicit rather than relying on the default is what makes this a one-line change
# instead of a hunt.
server.port=8090

# The connection string is NEVER committed. It is read from the environment at startup, and
# the placeholder below is the only form of it that appears in the repository.
#
# The variable is project-scoped for a reason: this machine already has a MONGODB_URI
# pointing at a different project's database. Reusing that name would connect this app to
# the wrong store successfully and silently, which is worse than failing to start.
#
# If GEEKYCHADS_MONGODB_URI is unset the application FAILS AT STARTUP with "Could not
# resolve placeholder". That is the desired behaviour - a server that starts without a
# database and only fails on the first request is harder to diagnose than one that refuses.
#
# BOOT 4 NOTE: the key is spring.mongodb.uri. The older spring.data.mongodb.uri that most
# tutorials still show is deprecated at error level and IGNORED SILENTLY - the driver then
# falls back to mongodb://localhost/test and fails with a connection refused that reads like
# a network problem rather than a configuration one.
spring.mongodb.uri=${GEEKYCHADS_MONGODB_URI}
spring.mongodb.database=CitiBankTraining

# Do not name the offending field in a validation failure. Terse errors are deliberate -
# a 400 that lists which constraint failed hands a caller free reconnaissance.
server.error.include-binding-errors=never
