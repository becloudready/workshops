name: Deploy Notice Board (javier-benitez)

on:
  push:
    branches: [master]
    paths:
      - "workshops/fullstack-aws/projects/submissions/javier-benitez/**"
      - ".github/workflows/javier-benitez-notice-board.yml"
  workflow_dispatch:

concurrency:
  group: javier-benitez-notice-board
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workshops/fullstack-aws/projects/submissions/javier-benitez

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workshops/fullstack-aws/projects/submissions/javier-benitez/frontend/package-lock.json

      - name: Build and deploy backend
        run: |
          python build.py
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://backend/lambda.zip
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}

      - name: Build and deploy frontend
        working-directory: workshops/fullstack-aws/projects/submissions/javier-benitez/frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          npm run build
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }}/ --delete

      - name: Smoke test the API
        run: curl -fsS "${{ secrets.VITE_API_URL }}/notices"
